name: marketplace-watcher

on:
  schedule:
    - cron: '*/30 * * * *'   # every ~30 min (GitHub may delay a few minutes)
  workflow_dispatch: {}

concurrency:
  group: marketplace-watcher
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install puppeteer-core
        run: npm install --no-save puppeteer-core

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Scan marketplaces
        env:
          WATCHER_SECRET: ${{ secrets.WATCHER_SECRET }}
          WATCHER_ENDPOINT: https://www.altaradesign.com/api/watcher
          CHROME_PATH: /usr/bin/google-chrome
        run: xvfb-run --auto-servernum node watcher/scan.mjs
