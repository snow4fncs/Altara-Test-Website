<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Outfit:wght@300;400;500;600;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:Outfit,sans-serif;background:#0c0d10}
.ph{position:absolute;inset:0;background-size:cover;background-position:center 60%}
.gradT{position:absolute;top:0;left:0;right:0;height:280px;background:linear-gradient(to bottom,rgba(10,11,13,.6),rgba(10,11,13,0))}
.grad{position:absolute;left:0;right:0;bottom:0;height:1000px;background:linear-gradient(to top,rgba(10,11,13,.96) 0%,rgba(10,11,13,.82) 45%,rgba(10,11,13,0) 100%)}
.brand{position:absolute;top:88px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-size:38px;letter-spacing:.44em;color:#EDE8DF;text-transform:uppercase;text-shadow:0 1px 14px rgba(0,0,0,.5)}
.stars{position:absolute;left:0;right:0;bottom:600px;text-align:center;color:#C4A97A;font-size:54px;letter-spacing:.35em;text-indent:.35em}
blockquote{position:absolute;left:80px;right:80px;bottom:330px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:72px;line-height:1.16;color:#EDE8DF;text-shadow:0 2px 26px rgba(0,0,0,.55)}
.attr{position:absolute;left:0;right:0;bottom:240px;text-align:center;font-weight:500;font-size:30px;letter-spacing:.14em;color:rgba(237,232,223,.72);text-transform:uppercase}
.chips{position:absolute;left:0;right:0;bottom:110px;display:flex;justify-content:center}
.chip{background:#C4A97A;color:#141518;font-weight:700;font-size:34px;padding:22px 34px}
.chip2{background:rgba(237,232,223,.13);border:1px solid rgba(237,232,223,.4);color:#EDE8DF;font-weight:500;font-size:30px;padding:23px 32px;backdrop-filter:blur(4px)}
</style>
<div class="ph" style="background-image:url('../social/assets/incar-black.jpg')"></div>
<div class="gradT"></div><div class="grad"></div>
<div class="brand">Altara</div>
<div class="stars">★★★★★</div>
<blockquote>&ldquo;Good quality material and does not slip off the seats.&rdquo;</blockquote>
