<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Outfit:wght@300;400;500;600&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:Outfit,sans-serif;background:#b9a58b}
.ph{position:absolute;inset:0;background:url('plinth-clean.jpg') center top/cover}
.txt{position:absolute;left:60px;right:60px;text-align:center;color:#F3EBDD}
.eb{font-size:30px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;margin-bottom:18px}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:112px;line-height:1.0;letter-spacing:-.01em}
h1 em{font-style:italic}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:48px;line-height:1.2;margin-top:18px}
/* 4:5 */
body.s1350 .ph{background-size:1240px auto;background-position:center -400px}
body.s1350 .txt{top:935px}
body.s1350 h1{font-size:96px}
body.s1350 .sub{font-size:42px;margin-top:14px}
/* 1:1 */
body.s1080{height:1080px}
body.s1080 .ph{background-size:1150px auto;background-position:center -530px}
body.s1080 .txt{top:700px}
body.s1080 h1{font-size:84px}
body.s1080 .sub{font-size:40px;margin-top:12px}
body.s1080 .eb{font-size:26px;margin-bottom:12px}
/* 9:16 */
body.s1920{height:1920px}
body.s1920 .ph{background-size:1080px auto;background-position:center top}
body.s1920 .txt{top:1300px}
body.s1920 h1{font-size:104px}
body.s1920 .sub{font-size:50px}
</style>
<div class="ph"></div>
<div class="txt"><div class="eb" id="eb"></div><h1 id="h1"></h1><div class="sub" id="sub"></div></div>
<script>
const q=new URLSearchParams(location.search);document.body.className='s'+(q.get('size')||'1350');
document.getElementById('eb').innerHTML=q.get('eb')||'';document.getElementById('h1').innerHTML=q.get('h1')||'';document.getElementById('sub').innerHTML=q.get('sub')||'';
</script>
