<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Outfit:wght@300;400;500;600&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:Outfit,sans-serif;background:#0c0d10;color:#F3EBDD}
.ph{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:brightness(.42) saturate(.85)}
.card{position:absolute;left:72px;right:72px;top:50%;transform:translateY(-50%);padding:64px 64px 56px;background:rgba(12,13,16,.72);border:1px solid rgba(243,235,221,.16)}
.k{font-size:26px;letter-spacing:.22em;text-transform:uppercase;color:#C4A97A;margin-bottom:26px}
ul{list-style:none}
li{font-family:'Cormorant Garamond',serif;font-size:56px;line-height:1.18;display:flex;gap:22px;align-items:baseline;padding:12px 0;border-bottom:1px solid rgba(243,235,221,.1)}
li .x{font-family:Outfit,sans-serif;font-size:34px;font-weight:500;color:#D98A8A;width:36px;flex:0 0 36px}
li.no{color:rgba(243,235,221,.72)}
.then{margin-top:38px}
.then li{border-bottom:0;color:#F3EBDD;font-size:62px}
.then li .x{color:#7FBF9A}
.foot{margin-top:34px;padding-top:26px;border-top:1px solid rgba(196,169,122,.4);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:44px;text-align:center;color:#E6D7B8}
body.s1080{height:1080px} body.s1080 .card{padding:44px 56px 40px} body.s1080 li{font-size:46px;padding:8px 0} body.s1080 .then li{font-size:50px} body.s1080 .then{margin-top:24px} body.s1080 .foot{font-size:38px;margin-top:22px;padding-top:18px} body.s1080 .k{margin-bottom:16px}
body.s1920{height:1920px} body.s1920 .card{top:46%} body.s1920 li{font-size:60px} body.s1920 .then li{font-size:66px}
</style>
<div class="ph" id="ph"></div>
<div class="card">
  <div class="k" id="k1"></div>
  <ul id="was"></ul>
  <div class="then"><div class="k" id="k2"></div><ul id="now"></ul></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const q=new URLSearchParams(location.search);document.body.className='s'+(q.get('size')||'1350');
document.getElementById('ph').style.backgroundImage="url('"+q.get('img')+"')";
document.getElementById('k1').textContent=q.get('k1')||'';document.getElementById('k2').textContent=q.get('k2')||'';
document.getElementById('foot').innerHTML=q.get('foot')||'';
const li=(t,ok)=>'<li class="'+(ok?'':'no')+'"><span class="x">'+(ok?'✓':'✕')+'</span><span>'+t+'</span></li>';
document.getElementById('was').innerHTML=(q.get('was')||'').split('|').filter(Boolean).map(t=>li(t,false)).join('');
document.getElementById('now').innerHTML=(q.get('now')||'').split('|').filter(Boolean).map(t=>li(t,true)).join('');
</script>
