<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@400;600;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:Outfit,sans-serif;background:#0c0d10}
.ph{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.lines{position:absolute;left:56px;top:64px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.lines span{background:rgba(12,13,16,.78);color:#F3EBDD;font-weight:700;font-size:62px;line-height:1.08;padding:10px 22px 14px;letter-spacing:-.01em}
.lines span.small{font-size:44px;font-weight:600}
.inset{position:absolute;right:56px;bottom:150px;width:400px;height:400px;border:8px solid #F3EBDD;border-radius:34px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.inset div{width:100%;height:100%;background-size:cover;background-position:center}
.cap{position:absolute;right:56px;bottom:96px;width:400px;text-align:center;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#F3EBDD;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.price{position:absolute;left:56px;bottom:96px;background:#C4A97A;color:#141518;font-weight:700;font-size:40px;padding:14px 26px}
body.s1080{height:1080px} body.s1080 .lines span{font-size:52px} body.s1080 .lines span.small{font-size:38px} body.s1080 .inset{width:320px;height:320px;bottom:120px} body.s1080 .cap{width:320px;bottom:72px} body.s1080 .price{bottom:72px;font-size:34px}
body.s1920{height:1920px} body.s1920 .lines{top:260px} body.s1920 .inset{bottom:420px} body.s1920 .cap{bottom:370px} body.s1920 .price{bottom:370px}
</style>
<div class="ph" id="ph"></div>
<div class="lines" id="lines"></div>
<div class="inset"><div id="in"></div></div><div class="cap" id="cap"></div>
<div class="price" id="price"></div>
<script>
const q=new URLSearchParams(location.search);document.body.className='s'+(q.get('size')||'1350');
document.getElementById('ph').style.backgroundImage="url('"+q.get('img')+"')";
document.getElementById('in').style.backgroundImage="url('"+q.get('inset')+"')";
document.getElementById('cap').textContent=q.get('cap')||'';document.getElementById('price').textContent=q.get('price')||'';
document.getElementById('lines').innerHTML=(q.get('lines')||'').split('|').map((t,i,a)=>'<span class="'+(i===a.length-1&&a.length>2?'small':'')+'">'+t+'</span>').join('');
</script>
