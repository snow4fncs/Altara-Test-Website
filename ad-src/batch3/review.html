<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Outfit:wght@400;500;600&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:Outfit,sans-serif;background:#0c0d10;color:#F3EBDD}
.ph{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:brightness(.55)}
.card{position:absolute;left:80px;right:80px;bottom:120px;background:#F3EBDD;color:#141518;padding:56px 60px 48px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.h{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:74px;line-height:1.02;letter-spacing:-.01em;margin-bottom:22px}
.stars{color:#B98A2E;font-size:44px;letter-spacing:6px;margin-bottom:16px}
.q{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:46px;line-height:1.28}
.who{margin-top:24px;font-size:26px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:12px}
.who .v{color:#2E7D4F;font-weight:600;font-size:24px}
.foot{position:absolute;left:80px;right:80px;top:80px;text-align:left;font-size:28px;letter-spacing:.2em;text-transform:uppercase;color:#E6D7B8}
body.s1080{height:1080px} body.s1080 .card{bottom:70px;padding:40px 48px 36px} body.s1080 .h{font-size:60px;margin-bottom:14px} body.s1080 .q{font-size:38px} body.s1080 .stars{font-size:36px} body.s1080 .foot{top:56px}
body.s1920{height:1920px} body.s1920 .card{bottom:360px} body.s1920 .foot{top:240px}
</style>
<div class="ph" id="ph"></div>
<div class="foot" id="foot"></div>
<div class="card"><div class="h" id="h"></div><div class="stars">★★★★★</div><div class="q" id="q"></div><div class="who"><span id="who"></span><span class="v">✓ Verified purchase</span></div></div>
<script>
const q=new URLSearchParams(location.search);document.body.className='s'+(q.get('size')||'1350');
document.getElementById('ph').style.backgroundImage="url('"+q.get('img')+"')";
for(const k of ['h','q','who','foot'])document.getElementById(k).innerHTML=q.get(k)||'';
</script>
