<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@300;400;500;600;700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:Outfit,sans-serif;background:#0c0d10;color:#EDE8DF}
.ph{position:absolute;inset:0;background:url('/social/assets/incar-black.jpg') center 30%/cover;filter:brightness(.2) saturate(.7)}
.wrap{position:absolute;left:72px;right:72px;top:120px}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:84px;line-height:1.02;text-align:center;margin-bottom:44px}
h1 em{font-style:italic;color:#C4A97A}
table{width:100%;border-collapse:collapse;font-size:31px;line-height:1.3}
th{font-weight:600;font-size:26px;letter-spacing:.14em;text-transform:uppercase;padding:0 0 18px;text-align:left;color:#C4A97A}
th:first-child{color:#9a948a}
td{padding:24px 18px 24px 0;border-top:1px solid rgba(237,232,223,.18);vertical-align:top;width:50%}
td:first-child{color:#b5afa4}
td strong{color:#fff;font-weight:600}
.foot{position:absolute;left:72px;right:72px;bottom:96px;text-align:center;font-family:'Cormorant Garamond',serif;font-size:52px;font-style:italic}
body.s1080{height:1080px} body.s1080 .wrap{top:80px} body.s1080 h1{font-size:70px;margin-bottom:30px} body.s1080 table{font-size:28px} body.s1080 td{padding:18px 14px 18px 0} body.s1080 .foot{bottom:60px;font-size:44px}
body.s1920{height:1920px} body.s1920 .wrap{top:380px} body.s1920 .foot{bottom:340px}
</style>
<div class="ph"></div>
<div class="wrap">
  <h1 id="h1"></h1>
  <table><thead><tr><th id="l">A beach towel</th><th id="r">Altara Twin Set</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<div class="foot" id="foot"></div>
<script>
const q=new URLSearchParams(location.search);document.body.className='s'+(q.get('size')||'1350');
document.getElementById('h1').innerHTML=q.get('h1')||'';document.getElementById('foot').innerHTML=q.get('foot')||'';
if(q.get('l'))document.getElementById('l').textContent=q.get('l');if(q.get('r'))document.getElementById('r').textContent=q.get('r');
document.getElementById('rows').innerHTML=(q.get('rows')||'').split('||').map(r=>{const [a,b]=r.split('|');return '<tr><td>'+a+'</td><td><strong>'+b+'</strong></td></tr>'}).join('');
</script>
