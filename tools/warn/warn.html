<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  @page { size: A4; margin: 0; } * { margin:0; padding:0; box-sizing:border-box; } html, body { background:#fff; }
  /* Avery L7160: 3 x 7 labels of 63.5 x 38.1 mm on A4 */
  .sheet { width:210mm; height:297mm; padding:15.15mm 7.2mm 0; display:grid; grid-template-columns:repeat(3,63.5mm); column-gap:2.5mm; grid-auto-rows:38.1mm; page-break-after:always; }
  .sheet:last-child { page-break-after:auto; }
  .lab { width:63.5mm; height:38.1mm; padding:4mm 4.5mm; background:#0C0D10; color:#EDE8DF; font-family:'Outfit',sans-serif; display:flex; flex-direction:column; justify-content:center; border-radius:0; }
  .lab .b { font-size:7pt; letter-spacing:.3em; text-transform:uppercase; color:#C4A97A; margin-bottom:1.6mm; font-weight:500; }
  .lab .b span { color:#EDE8DF; letter-spacing:.3em; }
  .lab .t { font-size:10pt; line-height:1.28; font-weight:300; color:rgba(237,232,223,.92); }
  /* single label preview */
  body.one { display:flex; align-items:center; justify-content:center; height:60mm; width:80mm; }
</style>
<div id="root"></div>
<script>
  const q = new URLSearchParams(location.search); const n = +(q.get('n') || 105);
  const lab = '<div class="lab"><div class="b">Altara <span>· packaging notice</span></div><div class="t">Warning: to avoid danger of suffocation, keep this plastic bag away from babies and children. Do not use this bag in cribs, beds, carriages or playpens. This bag is not a toy.</div></div>';
  if (q.get('one')) { document.body.className = 'one'; document.getElementById('root').innerHTML = lab; }
  else { let h = ''; for (let i = 0; i < n; i += 21) { h += '<div class="sheet">'; for (let k = i; k < Math.min(n, i + 21); k++) h += lab; h += '</div>'; } document.getElementById('root').innerHTML = h; }
</script>
