<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root { --ink:#0C0D10; --cream:#EDE8DF; --cream-dim:#A39E96; --gold:#C4A97A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; }
  /* Perfume hierarchy: brand small, scent name as the hero, a line of notes beneath. Laid out in mm for print. */
  .label { position:relative; width:var(--w); height:var(--h); background:var(--ink); color:var(--cream); overflow:hidden; font-family:'Outfit',sans-serif; }
  .bleed { position:absolute; inset:calc(-1 * var(--bleed)); background:var(--ink); z-index:0; }
  .frame { position:absolute; inset:var(--frame); border:0.12mm solid rgba(196,169,122,.55); z-index:1; pointer-events:none; }
  .safe { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:var(--pad); }
  .brand { width:var(--logo-w); height:auto; display:block; margin:0 auto; }
  .brand path { fill:var(--cream); }
  .no { font-weight:300; font-size:var(--no-fs); letter-spacing:.34em; text-transform:uppercase; color:var(--gold); padding-left:.34em; margin-top:var(--gap-a); }
  .name { font-family:'Cormorant Garamond',serif; font-weight:400; font-size:var(--name-fs); line-height:1.02; letter-spacing:-.01em; color:var(--cream); margin-top:var(--gap-b); }
  .name i { font-style:italic; color:var(--gold); }
  .rule { width:var(--rule-w); height:0.14mm; background:var(--gold); margin:var(--gap-c) auto 0; }
  .notes { font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:400; font-size:var(--notes-fs); line-height:1.25; color:var(--cream-dim); margin-top:var(--gap-d); letter-spacing:.01em; }
  .foot { position:absolute; left:0; right:0; bottom:var(--foot-y); z-index:2; text-align:center; font-weight:300; font-size:var(--foot-fs); letter-spacing:.28em; text-transform:uppercase; color:var(--cream-dim); padding-left:.28em; }
  .foot b { font-weight:300; color:var(--gold); padding:0 .3em; }
  /* bottle: 22 x 22 mm die */
  .bottle { --w:22mm; --h:22mm; --bleed:1.5mm; --frame:1.1mm; --pad:2.2mm 1.6mm 2.6mm; --logo-w:7.2mm; --no-fs:3pt; --name-fs:9.6pt; --notes-fs:4.1pt; --rule-w:4.5mm;
            --gap-a:1.2mm; --gap-b:.5mm; --gap-c:1.1mm; --gap-d:.8mm; --foot-fs:2.6pt; --foot-y:1.7mm; }
  .bottle .foot { display:none; }
  /* box: 30 x 30 mm */
  .box { --w:30mm; --h:30mm; --bleed:1.5mm; --frame:1.4mm; --pad:3mm 2.2mm 4.6mm; --logo-w:9.5mm; --no-fs:3.6pt; --name-fs:12.5pt; --notes-fs:5pt; --rule-w:6mm;
         --gap-a:1.8mm; --gap-b:.7mm; --gap-c:1.5mm; --gap-d:1mm; --foot-fs:3.3pt; --foot-y:2.4mm; }
</style>
