<!doctype html><meta charset="utf-8">
<style>
  @page { size: A4; margin: 12mm; } * { box-sizing:border-box; } body { font-family:Helvetica, Arial, sans-serif; margin:0; color:#111; }
  h1 { font-size:14pt; margin:0 0 4mm; } .grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:4mm; }
  figure { margin:0; text-align:center; font-size:7.5pt; } img { width:100%; height:auto; border:0.3mm solid #ccc; display:block; margin-bottom:1.5mm; }
  .row { margin-bottom:5mm; } .row h2 { font-size:10pt; margin:0 0 2mm; }
</style>
<h1>Proof sheet — all 10 stickers at reduced size (for reference only, print from the PDFs)</h1>
<div class="row"><h2>Box stickers, 52 × 68 mm</h2><div class="grid" id="box"></div></div>
<div class="row"><h2>Bottle stickers, 22 × 22 mm</h2><div class="grid" id="bottle"></div></div>
<script>
  const N=[['01','tobacco-vanilla'],['02','bergamot-pepper'],['03','leather'],['04','pineapple-birch'],['05','pear-freesia']];
  for (const v of ['box','bottle']) document.getElementById(v).innerHTML = N.map(([n,s]) => `<figure><img src="/brand%20assets/scent-labels/export-final/png/${n}-${s}-${v}.png"><figcaption>${n}-${s}-${v}.pdf</figcaption></figure>`).join('');
</script>
